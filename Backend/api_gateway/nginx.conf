events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Upstream Definitions for Microservices
    upstream auth_iam_service {
        server auth_iam:8001;
    }

    upstream sport_perf_service {
        server sport_perf:8002;
    }

    upstream finance_sponsoring_service {
        server finance_sponsoring:8003;
    }

    upstream operation_logistique_service {
        server operation_logistique:8004;
    }

    upstream marketing_cms_service {
        server marketing_cms:8005;
    }

    upstream messaging_notification_service {
        server messaging_notification:8006;
    }

    upstream documents_coffrefort_service {
        server documents_coffrefort:8007;
    }

    upstream ecommerce_merchandising_service {
        server ecommerce_merchandising:8008;
    }

    server {
        listen 8000;
        server_name localhost;

        client_max_body_size 50M;

        # Proxy headers setup
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. Auth IAM (#01)
        location /api/v1/auth/ {
            proxy_pass http://auth_iam_service;
        }

        # 2. Sport & Performance (#02)
        location /api/v1/sport/ {
            proxy_pass http://sport_perf_service;
        }

        # 3. Finance & Sponsoring (#03)
        location /api/v1/finance/ {
            proxy_pass http://finance_sponsoring_service;
        }

        # 4. Operation & Logistique (#04)
        location ~ ^/api/(inventory|fleet|loans|maintenance|procurement)/ {
            proxy_pass http://operation_logistique_service;
        }

        # 5. Marketing & CMS (#05)
        location /api/v1/cms/ {
            proxy_pass http://marketing_cms_service;
        }

        # 6. Messaging & Notifications (#06) - HTTP APIs
        location ~ ^/api/(chat|direct-messages|notifications)/ {
            proxy_pass http://messaging_notification_service;
        }

        # 6. Messaging & Notifications (#06) - WebSockets
        location /ws/ {
            proxy_pass http://messaging_notification_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 7. Documents & Coffre-fort (#07)
        location ~ ^/api/(vault|governance|hr-contracts|signatures)/ {
            proxy_pass http://documents_coffrefort_service;
        }

        # 8. E-commerce & Merchandising (#08)
        location /api/v1/shop/ {
            proxy_pass http://ecommerce_merchandising_service;
        }

        # Healthcheck Endpoint
        location /health/ {
            return 200 '{"status":"ok","gateway":"GeSport API Gateway"}';
            add_header Content-Type application/json;
        }
    }
}
