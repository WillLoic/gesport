version: '3.8'

services:
  # ── Base de données PostgreSQL multi-schémas/bases ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gesport_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gesport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gesport_pass}
      POSTGRES_DB: ${POSTGRES_DB:-gesport_db}
      POSTGRES_MULTIPLE_DATABASES: iam_db,sport_db,finance_db,logistics_db,cms_db,chat_db,vault_db,ecommerce_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gesport} -d ${POSTGRES_DB:-gesport_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Serveur Redis (Cache, Celery & Channels WebSockets) ─────────────────────
  redis:
    image: redis:7-alpine
    container_name: gesport_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Microservice 01 : Auth IAM ──────────────────────────────────────────────
  auth_iam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gesport_auth_iam
    restart: always
    env_file:
      - path: ./src/services/auth_iam/.env
        required: false
    environment:
      SERVICE_NAME: auth_iam
      SECRET_KEY: ${SECRET_KEY:-django-insecure-gesport-super-secret-key-2026-prod-dev}
      PORT: 8001
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: iam_db
      DB_USER: ${POSTGRES_USER:-gesport}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gesport_pass}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Microservice 02 : Sport & Performance ──────────────────────────────────
  sport_perf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gesport_sport_perf
    restart: always
    env_file:
      - path: ./src/services/sport_perf/.env
        required: false
    environment:
      SERVICE_NAME: sport_perf
      SECRET_KEY: ${SECRET_KEY:-django-insecure-gesport-super-secret-key-2026-prod-dev}
      PORT: 8002
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: sport_db
      DB_USER: ${POSTGRES_USER:-gesport}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gesport_pass}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Microservice 03 : Finance & Sponsoring ──────────────────────────────────
  finance_sponsoring:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gesport_finance_sponsoring
    restart: always
    env_file:
      - path: ./src/services/finance_sponsoring/.env
        required: false
    environment:
      SERVICE_NAME: finance_sponsoring
      SECRET_KEY: ${SECRET_KEY:-django-insecure-gesport-super-secret-key-2026-prod-dev}
      PORT: 8003
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: finance_db
      DB_USER: ${POSTGRES_USER:-gesport}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gesport_pass}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Microservice 04 : Opérations & Logistique ──────────────────────────────
  operation_logistique:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gesport_operation_logistique
    restart: always
    env_file:
      - path: ./src/services/operation_logistique/.env
        required: false
    environment:
      SERVICE_NAME: operation_logistique
      SECRET_KEY: ${SECRET_KEY:-django-insecure-gesport-super-secret-key-2026-prod-dev}
      PORT: 8004
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: logistics_db
      DB_USER: ${POSTGRES_USER:-gesport}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gesport_pass}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Microservice 05 : Marketing & CMS ───────────────────────────────────────
  marketing_cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gesport_marketing_cms
    restart: always
    env_file:
      - path: ./src/services/marketing_cms/.env
        required: false
    environment:
      SERVICE_NAME: marketing_cms
      SECRET_KEY: ${SECRET_KEY:-django-insecure-gesport-super-secret-key-2026-prod-dev}
      PORT: 8005
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: cms_db
      DB_USER: ${POSTGRES_USER:-gesport}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gesport_pass}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Microservice 06 : Messagerie & Notifications (WebSockets Daphne) ───────
  messaging_notification:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gesport_messaging_notification
    restart: always
    env_file:
      - path: ./src/services/messaging_notification/.env
        required: false
    environment:
      SERVICE_NAME: messaging_notification
      SECRET_KEY: ${SECRET_KEY:-django-insecure-gesport-super-secret-key-2026-prod-dev}
      USE_ASGI: "true"
      PORT: 8006
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: chat_db
      DB_USER: ${POSTGRES_USER:-gesport}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gesport_pass}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Microservice 07 : Documents & Coffre-Fort ──────────────────────────────
  documents_coffrefort:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gesport_documents_coffrefort
    restart: always
    env_file:
      - path: ./src/services/documents_coffrefort/.env
        required: false
    environment:
      SERVICE_NAME: documents_coffrefort
      SECRET_KEY: ${SECRET_KEY:-django-insecure-gesport-super-secret-key-2026-prod-dev}
      PORT: 8007
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: vault_db
      DB_USER: ${POSTGRES_USER:-gesport}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gesport_pass}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Microservice 08 : E-commerce & Merchandising ───────────────────────────
  ecommerce_merchandising:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gesport_ecommerce_merchandising
    restart: always
    env_file:
      - path: ./src/services/ecommerce_merchandising/.env
        required: false
    environment:
      SERVICE_NAME: ecommerce_merchandising
      SECRET_KEY: ${SECRET_KEY:-django-insecure-gesport-super-secret-key-2026-prod-dev}
      PORT: 8008
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ecommerce_db
      DB_USER: ${POSTGRES_USER:-gesport}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gesport_pass}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8008:8008"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── API Gateway Nginx ──────────────────────────────────────────────────────
  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: gesport_api_gateway
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - auth_iam
      - sport_perf
      - finance_sponsoring
      - operation_logistique
      - marketing_cms
      - messaging_notification
      - documents_coffrefort
      - ecommerce_merchandising

  # ── pgadmin (interface de BD) ──────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-willloic36@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-Willloic2005}
    ports:
      - "8080:80"
    depends_on:
      postgres :
        condition: service_healthy

volumes:
  postgres_data:
